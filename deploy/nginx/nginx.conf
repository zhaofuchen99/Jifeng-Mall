# =====================================================================
# 极锋商城（Jifeng Mall）生产形态反向代理配置
#
# 形态：Nginx 托管两个前端的静态资源（Vite 构建产物）并反向代理
#       /api 与 /upload 到网关 8888 —— 与开发期 vite dev server 的
#       proxy 行为等价，区别是这里托管的是 dist 产物而不是 dev server。
#
#   8090  →  前台商城 mall-web      浏览器访问 http://localhost:8090
#   8091  →  后台管理 admin-web     浏览器访问 http://localhost:8091
#
# 为什么用两个端口而不是同一个域名的两个子路径：
#   Vite 产物默认 base='/', index.html 里引用的是绝对路径 /assets/xxx.js。
#   两个前端挂在同一域名的 /mall 与 /admin 下会争抢 /assets/ 而互相覆盖。
#   生产上对应做法是给两个前端分配两个域名（server_name），或给其中一个
#   改 vite.config.js 的 base 后重新构建。本机演示取更省事的前者。
#
# 启动：cd /d D:\tools\nginx && start nginx
# 重载：nginx -s reload      停止：nginx -s quit
# 日志：D:\tools\nginx\logs\{mall,admin}.{access,error}.log
# 自检：nginx -t
#
# ⚠️ 本机 8080 被 Nacos 占用、8081 被 Redis 占用，所以这里用 8090/8091。
# =====================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 前端产物是 gzip 友好型文本，开压缩能省 ~70% 传输量。
    # 不写 gzip_types * —— 图片已经压过了，再压白耗 CPU。
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # 后端网关。所有 /api/** 与 /upload/** 都转发到这里，
    # 由网关按自己的路由表分发到 12 个业务服务（lb:// 经 Nacos 负载均衡）。
    upstream jifeng_gateway {
        server 127.0.0.1:8888;
    }

    # 两个 server 的 /api/ 与 /upload/ 规则是刻意重复写两遍的：
    # 抽成 include 文件更"整齐"，但会让读者在读配置时必须跳文件才能看全
    # 一个请求的处理路径。这里优先可读性。
    #
    # 注意 proxy_pass 末尾**不带 /** —— 路径原样透传
    # （/api/goods?x=1 到网关还是 /api/goods?x=1），与 vite proxy
    # 「不 rewrite」的约定一致。网关和业务服务的 controller 都依赖 /api 前缀。

    # -----------------------------------------------------------------
    # 前台商城
    # -----------------------------------------------------------------
    server {
        listen       8090;
        server_name  localhost;
        root         D:/shoplook2026/web/mall;
        index        index.html;

        access_log   logs/mall.access.log;
        error_log    logs/mall.error.log;

        # SPA 路由回退：两个前端的 router 都是 createWebHistory（history 模式），
        # 刷新 /goods/1 这类前端路由时磁盘上并没有对应文件，
        # 必须回退到 index.html 交给前端路由处理，否则刷新即 404。
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite 产物带内容哈希（index-C_cPB5Tp.js），内容变了文件名就变，
        # 可以放心长缓存。
        location /assets/ {
            # 只用 add_header，不用 expires —— 两者叠加会发出两个
            # Cache-Control 头（max-age=... 和 public, immutable），
            # 语义上等价但会让部分代理和抓包工具读乱。
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # index.html 绝不能被缓存，否则发版后用户拿到的还是旧的文件名清单
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /api/ {
            proxy_pass         http://jifeng_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        location /upload/ {
            proxy_pass         http://jifeng_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 10m;   # 与 upload-api 的单文件上限保持一致
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # -----------------------------------------------------------------
    # 后台管理端
    # -----------------------------------------------------------------
    server {
        listen       8091;
        server_name  localhost;
        root         D:/shoplook2026/web/admin;
        index        index.html;

        access_log   logs/admin.access.log;
        error_log    logs/admin.error.log;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            # 只用 add_header，不用 expires —— 两者叠加会发出两个
            # Cache-Control 头（max-age=... 和 public, immutable），
            # 语义上等价但会让部分代理和抓包工具读乱。
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /api/ {
            proxy_pass         http://jifeng_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        location /upload/ {
            proxy_pass         http://jifeng_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 10m;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
