spring:
  application:
    name: jifeng-mall-category-api

  cloud:
    nacos:
      discovery:
        port: 10011
      config:
        file-extension: yaml
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 123456
        group: jifeng-mall
        namespace: jifeng-mall

  config:
    import: nacos:jifeng-mall-common.yaml

server:
  port: 10011

# 启用openfeign服务降级（删除分类前要调 good-api 校验商品引用）
feign:
  sentinel:
    enabled: on
